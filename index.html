<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><title>Memoru — 書く。残す。</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color-scheme:light;--bg:#f7f8fb;--panel:#fff;--text:#202638;--muted:#7b8497;--line:#e8eaf1;--accent:#587de8;--soft:#edf2ff;--danger:#d44c61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}body.dark{color-scheme:dark;--bg:#171b25;--panel:#222837;--text:#f3f4fa;--muted:#a4acc0;--line:#363d50;--soft:#303d60;--accent:#91adff}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.app{max-width:1100px;margin:auto;min-height:100dvh;display:grid;grid-template-columns:340px 1fr;gap:16px;padding:18px}.side,.editor{background:var(--panel);border:1px solid var(--line);border-radius:22px;min-width:0;overflow:hidden}.side{display:flex;flex-direction:column;max-height:calc(100dvh - 36px)}.brand{padding:22px 20px 8px;display:flex;align-items:center;justify-content:space-between}.brand h1{margin:0;font-size:27px;letter-spacing:-1px}.brand small{font-size:11px;color:var(--muted)}.stats{margin:14px 16px;background:var(--soft);border-radius:16px;padding:16px}.stats strong{font-size:26px;font-variant-numeric:tabular-nums}.stats span,.sub{font-size:12px;color:var(--muted)}.tools{display:flex;gap:7px;padding:0 16px 12px}.btn{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 12px;color:var(--text)}.primary{background:var(--accent);border-color:var(--accent);color:white}.grow{flex:1}.search{width:calc(100% - 32px);margin:0 16px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:12px;outline-color:var(--accent)}.folderbar{padding:0 16px 12px;display:flex;gap:8px}.folderbar select{min-width:0;flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}.notes{overflow:auto;flex:1;padding:0 10px 12px}.note{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:15px 12px;border-radius:10px}.note.active{background:var(--soft)}.note b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note p{font-size:12px;color:var(--muted);margin:6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note small{font-size:11px;color:var(--muted)}.sidebottom{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:7px}.editor{display:flex;flex-direction:column;min-height:calc(100dvh - 36px)}.edithead{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.edithead .status{margin-right:auto;font-size:12px;color:var(--muted)}.titleinput{border:0;outline:0;font-size:24px;font-weight:700;background:transparent;color:var(--text);width:100%;padding:20px 24px 10px}.meta{display:flex;justify-content:space-between;align-items:center;padding:0 24px 10px;color:var(--muted);font-size:12px;gap:8px}.meta select{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:5px;max-width:50%}.bodyinput{border:0;outline:0;resize:none;flex:1;min-height:250px;width:100%;padding:16px 24px 32px;line-height:1.9;font-size:16px;background:transparent;color:var(--text)}.shortcuts{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap}.shortcut{min-width:42px;padding:9px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px}.foot{padding:10px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:12px}.empty{padding:50px 20px;text-align:center;color:var(--muted)}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;width:min(94vw,620px);max-height:85dvh;padding:20px}dialog::backdrop{background:#0008}dialog h2{margin:0 0 14px;font-size:20px}.historyrow{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}.historyrow .grow{min-width:0}.historyrow small{color:var(--muted)}.preview{white-space:pre-wrap;max-height:180px;overflow:auto;background:var(--bg);padding:12px;border-radius:10px;font-size:13px}.dialogactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.danger{color:var(--danger)}.mobileback{display:none}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#293246;color:white;border-radius:12px;padding:10px 18px;display:none;z-index:100;font-size:13px;max-width:90vw}@media(max-width:700px){.app{display:block;padding:0}.side,.editor{border:0;border-radius:0;min-height:100dvh;max-height:100dvh}.editor{display:none}.app.editing .side{display:none}.app.editing .editor{display:flex}.mobileback{display:inline-block}.edithead{padding:12px}.titleinput{padding:18px 16px 10px}.meta{padding:0 16px 10px}.bodyinput{padding:12px 16px;min-height:100px}.shortcuts{position:sticky;bottom:0;padding:9px;gap:5px}.shortcut{padding:8px;min-width:39px}.side{height:100dvh}.notes{padding-bottom:40px}}@media(min-width:701px){.editor{height:calc(100dvh - 36px)}}
</style></head><body><main class="app" id="app"><section class="side"><div class="brand"><div><h1>Memoru <small>メモル</small></h1><div class="sub">書く。残す。いつでも、続きから。</div></div><button class="btn" id="theme" title="テーマ切替">☾</button></div><div class="stats"><span>すべてのメモの累計文字数</span><div><strong id="total">0</strong> <span>文字</span></div><span id="noteCount">0 件のメモ</span></div><div class="tools"><button class="btn primary grow" id="new">＋ 新しいメモ</button><button class="btn" id="folderAdd">＋ フォルダ</button></div><input id="search" class="search" placeholder="タイトル・本文を検索" aria-label="メモを検索"><div class="folderbar"><select id="filter" aria-label="フォルダ絞り込み"></select><button class="btn" id="folderManage">管理</button></div><div class="notes" id="notes"></div><div class="sidebottom"><button class="btn" id="export">バックアップ</button><button class="btn" id="import">復元・読込</button><input type="file" id="file" accept="application/json,.json" hidden></div></section><section class="editor" id="editor"><div class="edithead"><button class="btn mobileback" id="back">‹ 一覧</button><button class="btn mobileback" id="quickNew">＋ 新規</button><span class="status" id="status">保存済み</span><button class="btn" id="snapshot">★ 履歴保存</button><button class="btn" id="history">履歴</button><button class="btn danger" id="delete">削除</button></div><input class="titleinput" id="title" placeholder="タイトルなし" aria-label="メモのタイトル"><div class="meta"><select id="noteFolder" aria-label="メモのフォルダ"></select><span id="counter">0 文字</span></div><textarea class="bodyinput" id="body" placeholder="ここから書きはじめよう…" spellcheck="true" aria-label="メモ本文"></textarea><div class="shortcuts" id="shortcuts"></div><div class="foot"><span>自動保存・編集履歴オン</span><span id="updated"></span></div></section></main><dialog id="histDialog"><h2>編集履歴</h2><p class="sub">過去の文章を確認してから復元できます。自動履歴は編集中およそ5分ごとに記録します。</p><div id="historyList"></div><div class="dialogactions"><button class="btn" onclick="document.getElementById('histDialog').close()">閉じる</button></div></dialog><div id="toast" role="status"></div><script>
'use strict';
const DB_NAME='memoru-db', STORE='state';let db=null,state={notes:[],folders:['未分類'],selected:null,theme:'light'},saveChain=Promise.resolve(),dirty=false,lastSnapshotAt=0,snapshotTimer=null,saveTimer=null,selection=[0,0];const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),now=()=>Date.now(),date=t=>new Date(t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),count=s=>Array.from(s||'').length;const toast=s=>{const el=$('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2700)};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function getState(){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function putState(value){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,'main');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}function persist(){dirty=true;$('status').textContent='保存中…';const snapshot=structuredClone(state);saveChain=saveChain.catch(()=>{}).then(()=>putState(snapshot)).then(()=>{if(!dirty)return;dirty=false;$('status').textContent='保存済み'}).catch(e=>{$('status').textContent='保存失敗';toast('保存に失敗しました。バックアップを確認してください');console.error(e)});return saveChain}function current(){return state.notes.find(n=>n.id===state.selected)}function makeNote(){return{id:uid(),title:'',body:'',folder:'未分類',created:now(),updated:now(),history:[]}}function safeHistory(n,manual=false){const latest=n.history[n.history.length-1];if(latest&&latest.title===n.title&&latest.body===n.body&&latest.folder===n.folder)return false;n.history.push({id:uid(),title:n.title,body:n.body,folder:n.folder,time:now(),manual});if(n.history.length>50){const protectedEntries=n.history.filter(h=>h.manual);const overflow=n.history.length-50;let removed=0;n.history=n.history.filter(h=>{if(removed>=overflow)return true;if(!h.manual||protectedEntries.length===n.history.length){removed++;return false}return true})}lastSnapshotAt=now();return true}function updateStats(){$('total').textContent=state.notes.reduce((s,n)=>s+count(n.body),0).toLocaleString('ja-JP');$('noteCount').textContent=state.notes.length+' 件のメモ'}function renderFolders(){const selected=$('filter').value||'すべて';$('filter').replaceChildren();for(const f of ['すべて',...state.folders]){const o=new Option(f,f);$('filter').add(o)}$('filter').value=['すべて',...state.folders].includes(selected)?selected:'すべて';const n=current();$('noteFolder').replaceChildren();for(const f of state.folders)$('noteFolder').add(new Option(f,f));if(n)$('noteFolder').value=n.folder}function renderList(){const q=$('search').value.toLocaleLowerCase(),f=$('filter').value;const items=state.notes.filter(n=>(f==='すべて'||n.folder===f)&&((n.title+' '+n.body).toLocaleLowerCase().includes(q))).sort((a,b)=>b.updated-a.updated);$('notes').replaceChildren();if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='メモがありません。＋から作成できます。';$('notes').append(p)}for(const n of items){const b=document.createElement('button');b.className='note'+(n.id===state.selected?' active':'');const name=document.createElement('b');name.textContent=n.title||'タイトルなし';const desc=document.createElement('p');desc.textContent=n.body.replace(/\s+/g,' ').slice(0,100)||'本文なし';const meta=document.createElement('small');meta.textContent=date(n.updated)+' · '+count(n.body).toLocaleString()+'文字 · '+n.folder;b.append(name,desc,meta);b.onclick=()=>select(n.id);$('notes').append(b)}}function renderEditor(){const n=current();if(!n){$('title').value='';$('body').value='';$('title').disabled=true;$('body').disabled=true;$('counter').textContent='0 文字';return}$('title').disabled=false;$('body').disabled=false;$('title').value=n.title;$('body').value=n.body;$('noteFolder').value=n.folder;$('counter').textContent=count(n.body).toLocaleString()+' 文字';$('updated').textContent='更新 '+date(n.updated);$('status').textContent='保存済み'}function render(){document.body.classList.toggle('dark',state.theme==='dark');$('theme').textContent=state.theme==='dark'?'☀':'☾';updateStats();renderFolders();renderList();renderEditor()}function select(id){state.selected=id;lastSnapshotAt=now();render();$('app').classList.add('editing');persist()}function createNote(){const n=makeNote();state.notes.unshift(n);select(n.id);$('title').focus()}function edit(field,value){const n=current();if(!n)return;if(n[field]===value)return;const before={...n};if(!lastSnapshotAt)lastSnapshotAt=now();if(now()-lastSnapshotAt>=300000){n.title=before.title;n.body=before.body;n.folder=before.folder;safeHistory(n);lastSnapshotAt=now()}n[field]=value;n.updated=now();$('counter').textContent=count(n.body).toLocaleString()+' 文字';$('updated').textContent='更新 '+date(n.updated);updateStats();renderList();clearTimeout(saveTimer);saveTimer=setTimeout(persist,120);$('status').textContent='保存中…'}function snapshot(manual=true){const n=current();if(!n)return;const made=safeHistory(n,manual);if(made){persist();toast('編集履歴に保存しました')}else toast('同じ内容がすでに保存されています')}function openHistory(){const n=current();if(!n)return;const list=$('historyList');list.replaceChildren();const entries=[...n.history].reverse();if(!entries.length){const p=document.createElement('p');p.className='sub';p.textContent='まだ履歴がありません。★ 履歴保存で記録できます。';list.append(p)}for(const h of entries){const row=document.createElement('div');row.className='historyrow';const info=document.createElement('div');info.className='grow';const label=document.createElement('b');label.textContent=(h.manual?'★ 手動保存':'自動履歴')+' · '+date(h.time);const sub=document.createElement('div');sub.className='sub';sub.textContent=count(h.body)+'文字';info.append(label,sub);const view=document.createElement('button');view.className='btn';view.textContent='確認';view.onclick=()=>{const existing=row.querySelector('.preview');if(existing){existing.remove();return}const p=document.createElement('div');p.className='preview';p.textContent=(h.title||'タイトルなし')+'\n\n'+h.body;row.append(p)};const restore=document.createElement('button');restore.className='btn primary';restore.textContent='復元';restore.onclick=()=>{if(!confirm('この履歴の内容に復元しますか？現在の文章も履歴に保護します。'))return;safeHistory(n,true);n.title=h.title;n.body=h.body;n.folder=state.folders.includes(h.folder)?h.folder:'未分類';n.updated=now();persist();render();$('histDialog').close();toast('復元しました')};row.style.flexWrap='wrap';row.append(info,view,restore);list.append(row)}}function download(name,content){const blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function exportData(){download('memoru-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'Memoru',version:1,exported:new Date().toISOString(),data:state},null,2));toast('バックアップを書き出しました')}function validateData(d){if(d.app!=='Memoru'||!d.data||!Array.isArray(d.data.notes)||!Array.isArray(d.data.folders))throw Error('Memoruのバックアップではありません');if(d.data.notes.length>50000)throw Error('データ件数が多すぎます');for(const n of d.data.notes){if(typeof n.id!=='string'||typeof n.title!=='string'||typeof n.body!=='string'||!Array.isArray(n.history))throw Error('メモの形式が不正です')}return d.data}async function importData(file){try{if(file.size>50*1024*1024)throw Error('50MBを超えるファイルは読み込めません');const d=validateData(JSON.parse(await file.text()));if(!confirm('現在のメモをバックアップ内容で置き換えます。先に現在のデータをバックアップしてください。続けますか？'))return;state={notes:d.notes,folders:d.folders.filter(x=>typeof x==='string'),selected:d.notes.some(n=>n.id===d.selected)?d.selected:d.notes[0]?.id||null,theme:d.theme==='dark'?'dark':'light'};await persist();render();toast('バックアップを復元しました')}catch(e){alert('読み込みに失敗しました: '+e.message)}}
$('new').onclick=createNote;$('quickNew').onclick=()=>{createNote();$('body').focus()};$('back').onclick=()=>{$('app').classList.remove('editing');renderList()};$('title').oninput=e=>edit('title',e.target.value);$('body').oninput=e=>{selection=[e.target.selectionStart,e.target.selectionEnd];edit('body',e.target.value)};$('body').onkeyup=e=>selection=[e.target.selectionStart,e.target.selectionEnd];$('body').onclick=e=>selection=[e.target.selectionStart,e.target.selectionEnd];$('body').onselect=e=>selection=[e.target.selectionStart,e.target.selectionEnd];$('noteFolder').onchange=e=>{edit('folder',e.target.value);renderList()};$('search').oninput=renderList;$('filter').onchange=renderList;$('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';render();persist()};$('snapshot').onclick=()=>snapshot(true);$('history').onclick=()=>{openHistory();$('histDialog').showModal()};$('delete').onclick=()=>{const n=current();if(!n)return;if(!confirm('「'+(n.title||'タイトルなし')+'」を削除しますか？この操作は履歴からも復元できません。'))return;state.notes=state.notes.filter(x=>x.id!==n.id);state.selected=state.notes[0]?.id||null;persist();render();$('app').classList.remove('editing');toast('メモを削除しました')};$('folderAdd').onclick=()=>{const f=prompt('新しいフォルダ名');if(!f||!f.trim())return;const name=f.trim().slice(0,60);if(state.folders.includes(name)){toast('同じフォルダがあります');return}state.folders.push(name);persist();renderFolders();toast('フォルダを追加しました')};$('folderManage').onclick=()=>{const f=$('filter').value;if(f==='すべて'||f==='未分類'){toast('管理するフォルダを選択してください（未分類は削除不可）');return}const renamed=prompt('フォルダ名を変更（空欄にすると削除確認）',f);if(renamed===null)return;const name=renamed.trim();if(!name){if(!confirm('フォルダ「'+f+'」を削除しますか？中のメモは未分類へ移動します。'))return;state.folders=state.folders.filter(x=>x!==f);state.notes.forEach(n=>{if(n.folder===f)n.folder='未分類'})}else{if(name!==f&&state.folders.includes(name)){toast('同じフォルダがあります');return}state.folders[state.folders.indexOf(f)]=name;state.notes.forEach(n=>{if(n.folder===f)n.folder=name})}persist();render()};$('export').onclick=exportData;$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{if(e.target.files[0])await importData(e.target.files[0]);e.target.value=''};const shortcuts=['「」','『』','（）','……','――','【】','《》','！','？','♪'];for(const s of shortcuts){const b=document.createElement('button');b.className='shortcut';b.textContent=s;b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{const n=current();if(!n)return;const t=$('body'),start=Math.min(selection[0],t.value.length),end=Math.min(selection[1],t.value.length);let ins=s,offset=s.length;if(['「」','『』','（）','【】','《》'].includes(s)){ins=s[0]+t.value.slice(start,end)+s[1];offset=1}const result=t.value.slice(0,start)+ins+t.value.slice(end);t.value=result;edit('body',result);const pos=start+offset;t.focus();t.setSelectionRange(pos,pos);selection=[pos,pos]};$('shortcuts').append(b)}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(saveTimer);if(dirty)persist()}});window.addEventListener('pagehide',()=>{if(dirty)persist()});snapshotTimer=setInterval(()=>{const n=current();if(!n)return;if(now()-lastSnapshotAt>=300000&&lastSnapshotAt&&n.updated>=lastSnapshotAt){if(safeHistory(n,false))persist()}},60000);
(async()=>{try{db=await openDB();const saved=await getState();if(saved&&Array.isArray(saved.notes)&&Array.isArray(saved.folders)){state=saved}else{const n=makeNote();state.notes=[n];state.selected=n.id;await persist()}if(!state.folders.includes('未分類'))state.folders.unshift('未分類');if(!current())state.selected=state.notes[0]?.id||null;render();if(window.matchMedia('(max-width:700px)').matches){$('app').classList.add('editing');requestAnimationFrame(()=>{$('body').focus({preventScroll:true})})}}catch(e){console.error(e);alert('端末の保存領域を開けませんでした。プライベートブラウズ設定や空き容量を確認してください。')}})();
</script></body></html>
